syntax = "proto3";

package sdktransport;

service SdkTransportService {
  rpc Invoke (SdkInvokeRequest) returns (SdkInvokeResponse);
  // Server-streaming variant of Invoke - only namespaces registered as streaming-capable on the
  // host (currently just `ai.promptStream`) support this; everything else still goes through the
  // plain unary Invoke above. Same request shape, response comes as a sequence of chunks instead
  // of one message: zero or more `done=false` chunks carrying incremental `delta` text (or a
  // structured `event_type`/`event_json` pair - see SdkStreamChunk), then exactly one final
  // `done=true` chunk carrying `data_json` (mirrors SdkInvokeResponse.data_json - the full/
  // aggregated result) and `success`/`error`.
  rpc InvokeStream (SdkInvokeRequest) returns (stream SdkStreamChunk);
}

message SdkInvokeRequest {
  string namespace = 1;
  string params_json = 2;
  string context_json = 3;
}

message SdkInvokeResponse {
  bool success = 1;
  string data_json = 2;
  string error = 3;
}

message SdkStreamChunk {
  string delta = 1;
  bool done = 2;
  string data_json = 3;
  bool success = 4;
  string error = 5;
  // Structured event alternative to `delta`, used by routes that emit something other than plain
  // text (currently `ai.promptStream` with `opts.lineSchema` set - see DriverHelper.matchLineSchema
  // on the host and GrpcInvoker.ts's `lines` stream on the client). Empty string = this chunk is a
  // plain `delta` text chunk (the default, unchanged wire shape every existing stream still uses).
  // "parsed_line" -> event_json = `{"parsed": ParsedLine|null, "index": number}`.
  string event_type = 6;
  string event_json = 7;
}
